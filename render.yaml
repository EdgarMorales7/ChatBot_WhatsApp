services:
  - type: web
    name: whatsapp-chatbot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn chatbot:app"
    autoDeploy: true

cron:
  - name: verificar-expiracion-token
    schedule: "@daily"
    command: "python verificar_token.py"

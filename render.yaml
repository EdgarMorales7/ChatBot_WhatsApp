services:
  - type: web                          # Es un servicio web (Flask sobre Gunicorn)
    name: whatsapp-chatbot             # Nombre visible en Render
    env: python                        # Tipo de entorno: Python
    plan: free                         # Plan gratuito de Render
    buildCommand: "pip install -r requirements.txt"  # Comando para instalar dependencias
    startCommand: "gunicorn chatbot:app"             # Comando que Render ejecuta al iniciar
    autoDeploy: true                   # Se vuelve a desplegar cada vez que haces push a GitHub
